name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog
        run: python3 scripts/validate_catalog.py catalog.csv legacy/index.html

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Inject rating token
        env:
          RATING_CLIENT_TOKEN: ${{ secrets.RATING_CLIENT_TOKEN }}
        run: |
          sed -i "s|__GITHUB_RATING_TOKEN__|${RATING_CLIENT_TOKEN}|g" dist/assets/*.js dist/legacy/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
