name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog
        run: python3 scripts/validate_catalog.py catalog.csv index.html

      - name: Inject rating token
        env:
          RATING_CLIENT_TOKEN: ${{ secrets.RATING_CLIENT_TOKEN }}
        run: |
          mkdir -p _site
          shopt -s extglob dotglob
          cp -r !(_site) _site/
          rm -rf _site/.git _site/.github
          sed -i "s|__GITHUB_RATING_TOKEN__|${RATING_CLIENT_TOKEN}|g" _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
