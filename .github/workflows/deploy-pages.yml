name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Staged rollout. "next": classic UI at the site root, new design at /next/.
  # "main": new design at the root, classic UI at /legacy/ (and /next/ redirects).
  RELEASE_STAGE: next

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog
        run: python3 scripts/validate_catalog.py catalog.csv legacy/index.html

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Test and build
        run: |
          npm ci
          npm test
          npm run build

      - name: Performance budget
        run: |
          node scripts/check-budget.mjs dist
          npx lhci autorun --config=lighthouserc.cjs

      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Arrange the release stage
        if: env.RELEASE_STAGE == 'next'
        run: node scripts/stage-layout.mjs dist

      - name: Inject rating token
        env:
          RATING_CLIENT_TOKEN: ${{ secrets.RATING_CLIENT_TOKEN }}
        run: |
          grep -rl "__GITHUB_RATING_TOKEN__" dist | xargs -r sed -i "s|__GITHUB_RATING_TOKEN__|${RATING_CLIENT_TOKEN}|g"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
